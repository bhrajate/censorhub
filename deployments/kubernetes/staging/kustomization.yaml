apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: censorhub-staging

resources:
  - ../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: censorhub
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: censorhub
                resources:
                  requests:
                    cpu: "250m"
                    memory: "128Mi"
                  limits:
                    cpu: "1000m"
                    memory: "512Mi"
                env:
                  - name: APP_ENV
                    value: "staging"
                  - name: CENSORHUB_DATABASE_DSN
                    valueFrom:
                      secretKeyRef:
                        name: censorhub-secrets
                        key: database-dsn
                  - name: CENSORHUB_REDIS_ADDR
                    valueFrom:
                      secretKeyRef:
                        name: censorhub-secrets
                        key: redis-addr
                  - name: CENSORHUB_REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: censorhub-secrets
                        key: redis-password

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: censorhub
      spec:
        minReplicas: 2
        maxReplicas: 10
