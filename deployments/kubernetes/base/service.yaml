apiVersion: v1
kind: Service
metadata:
  name: censorhub-http
  namespace: censorhub
  labels:
    app: censorhub
spec:
  type: ClusterIP
  selector:
    app: censorhub
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: censorhub-grpc
  namespace: censorhub
  labels:
    app: censorhub
spec:
  type: ClusterIP
  selector:
    app: censorhub
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
