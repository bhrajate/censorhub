apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: censorhub
  namespace: censorhub
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: censorhub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: censorhub-http
                port:
                  number: 80
